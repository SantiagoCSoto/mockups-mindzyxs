<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="../Logo1.png">
<title>Directorio de psicólogos - Mindzyxs</title>
<style>
:root{--cyan:#6ECFD4;--cyan-hover:#5ABCC2;--text:#1E293B;--muted:#64748B;--violet:#6B5BCE}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#fff;color:var(--text);min-height:100vh;display:flex;flex-direction:column}
.bg-blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;opacity:.55}
.blob-pink{width:580px;height:420px;background:#FDE0EE;top:-90px;left:-110px;border-radius:40% 60% 50% 50%}
.blob-lav{width:600px;height:400px;background:#EDE6FF;top:-60px;right:-110px;border-radius:60% 40% 55% 45%}
.header-nav{display:flex;align-items:center;justify-content:space-between;padding:12px 28px;background:rgba(255,255,255,.9);border-bottom:1px solid #F0EAF6;position:sticky;top:0;z-index:40}
.logo-container .logo-link{display:flex;align-items:center;gap:10px;text-decoration:none;font-size:18px;font-weight:700;color:#1E293B}
.logo-container .logo-img{height:38px;width:auto;border-radius:8px}
.main-nav ul{display:flex;list-style:none;gap:24px}
.main-nav a{text-decoration:none;font-size:14px;color:var(--muted);font-weight:500}
.btn-logout{background:#EB5771;color:#fff;border:none;padding:7px 16px;border-radius:20px;font-size:12.5px;font-weight:600;cursor:pointer}
.wrap{width:100%;max-width:900px;margin:0 auto;padding:28px 20px 40px;flex:1}
.btn-volver-landing{background:#fff;border:1.5px solid #CBD5E1;color:#475569;font-size:13px;font-weight:600;padding:9px 24px;border-radius:20px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;margin-bottom:14px}
.card{background:#fff;border:1px solid #EDE8F0;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.05);padding:24px 22px}
.panel-head h1{font-size:22px}
.panel-head .sub{font-size:12.5px;color:var(--muted);margin-top:4px}
.dash-invitado{margin-top:16px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.grid-avail{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.psi-card{border:1px solid #DFDAEE;border-radius:14px;padding:18px;background:#fff;display:flex;flex-direction:column;gap:10px}
.psi-top{display:flex;gap:12px;align-items:center}
.psi-avatar{width:48px;height:48px;border-radius:50%;background:#EDE7FF;color:var(--violet);display:grid;place-items:center;font-weight:700}
.psi-top b{font-size:14px;display:block}
.psi-top small{font-size:11.5px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip-esp{font-size:11px;font-weight:600;background:#F3F1FA;color:#5A5D72;border:1px solid #E6E1F2;padding:4px 10px;border-radius:20px}
.psi-count{font-size:12px;color:var(--muted)}
.btn-tile{height:38px;border-radius:20px;border:none;background:var(--cyan);color:#fff;font-weight:700;font-size:12.5px;cursor:pointer}
.btn-tile:hover{background:var(--cyan-hover)}
.empty{text-align:center;padding:24px;border:1px dashed #DFDAEE;border-radius:12px;background:#FBFAFF;font-size:12.5px;color:var(--muted);margin-top:12px}
.footer{border-top:1px solid #EFE6F8;background:#FDF9FF;padding:14px 0;margin-top:auto}
.footer-in{max-width:1000px;margin:0 auto;padding:0 20px;display:flex;gap:24px;flex-wrap:wrap;align-items:center;justify-content:center;font-size:12.5px}
.footer-in a{color:var(--muted);text-decoration:none}
.aviso-link{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:#5A45C9;background:linear-gradient(180deg,#F2EBFF,#E3D8FC);border:1px solid #CFBFF0;padding:7px 18px;border-radius:20px;font-size:12px;text-decoration:none}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:#1E293B;color:#fff;padding:12px 20px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;transition:all .3s;pointer-events:none;z-index:10000;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:680px){.main-nav{display:none}.grid,.grid-avail{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="bg-blobs" aria-hidden="true"><div class="blob blob-pink"></div><div class="blob blob-lav"></div></div>

<header class="header-nav">
  <div class="logo-container">
    <a href="#" class="logo-link"><img src="../Logo1.png" alt="Logo Mindzyxs" class="logo-img"><span>Mindzyxs</span></a>
  </div>
  <nav class="main-nav" aria-label="Navegación principal">
    <ul>
      <li><a href="#">Nosotros</a></li>
      <li><a href="#">Ayuda</a></li>
    </ul>
  </nav>
  <div class="header-right">
    <div class="header-auth-buttons">
      <button type="button" id="btn-logout" class="btn-logout">Cerrar sesión</button>
    </div>
  </div>
</header>

<main class="wrap">
  <a href="#" id="btnVolver" class="btn-volver-landing">&larr; Volver al panel</a>
  <section class="card section-sensibles">
    <div class="panel-head">
      <h1>Directorio de psicólogos</h1>
      <p class="sub">Conozca sus especialidades y pacientes asignados para ver cuál se ajusta mejor a Usted.</p>
    </div>
    <div class="dash-invitado" id="dashDirectorio">
      <div class="grid grid-avail" id="dirGrid"></div>
      <div class="empty" id="dirEmpty" style="display:none;">
        <p>No hay psicólogos disponibles en este momento.</p>
      </div>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="footer-in">
    <a href="#">Privacidad</a><a href="#">Cookies</a><a href="#">Términos</a>
    <a href="#" class="aviso-link" id="footerAviso" role="button" aria-haspopup="dialog"><span>ℹ️</span> Aviso: no diagnóstico</a>
  </div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  var dirGrid=document.getElementById('dirGrid');
  var dirEmpty=document.getElementById('dirEmpty');
  var toast=document.getElementById('toast');
  function showToast(m){toast.textContent=m;toast.classList.add('show');clearTimeout(showToast._t);showToast._t=setTimeout(function(){toast.classList.remove('show');},2400);}

  var psicologosDemo=[
    {nombre:'Dra. Ana Torres',especialidades:['Ansiedad','Autoestima'],pacientes:12,iniciales:'AT'},
    {nombre:'Dr. Luis Herrera',especialidades:['Depresión','Estrés'],pacientes:8,iniciales:'LH'}
  ];

  function render(){
    dirGrid.innerHTML='';
    if(psicologosDemo.length===0){dirEmpty.style.display='block';return;}
    dirEmpty.style.display='none';
    psicologosDemo.forEach(function(p){
      var art=document.createElement('article');art.className='psi-card';
      var top=document.createElement('div');top.className='psi-top';
      var av=document.createElement('div');av.className='psi-avatar';av.textContent=p.iniciales;
      var info=document.createElement('div');
      var b=document.createElement('b');b.textContent=p.nombre;
      var sm=document.createElement('small');sm.textContent=p.pacientes+' pacientes asignados';
      info.appendChild(b);info.appendChild(sm);top.appendChild(av);top.appendChild(info);
      var chips=document.createElement('div');chips.className='chips';
      p.especialidades.forEach(function(e){var s=document.createElement('span');s.className='chip-esp';s.textContent=e;chips.appendChild(s);});
      var count=document.createElement('div');count.className='psi-count';count.textContent='Especialidades: '+p.especialidades.join(', ')+' · '+p.pacientes+' pacientes asignados';
      var btn=document.createElement('button');btn.type='button';btn.className='btn-tile';btn.textContent='Solicitar chat';
      btn.addEventListener('click',function(){showToast('Solicitud enviada a '+p.nombre+' (demo)');console.log('[directorio] solicitud a',p.nombre);});
      art.appendChild(top);art.appendChild(chips);art.appendChild(count);art.appendChild(btn);
      dirGrid.appendChild(art);
    });
  }
  render();
  document.getElementById('btn-logout').addEventListener('click',function(){showToast('Sesión cerrada (demo)');});
  document.getElementById('btnVolver').addEventListener('click',function(e){e.preventDefault();showToast('Volviendo al panel (demo)');});
  document.getElementById('footerAviso').addEventListener('click',function(e){e.preventDefault();showToast('Aviso: Mindzyxs no realiza diagnósticos');});
})();
</script>
</body>
</html>
