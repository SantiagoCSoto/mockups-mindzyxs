<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="../Logo1.png">
<title>Nueva contraseña - Mindzyxs</title>
<style>
  :root{
    --cyan:#6ECFD4; --cyan-hover:#5ABCC2; --text:#2E2E33; --muted:#8E91A3;
    --error:#E85D7A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Arial,sans-serif;background:#FFF;color:var(--text);min-height:100vh}
  .header-nav{height:60px;display:flex;align-items:center;justify-content:space-between;
    padding:0 20px;max-width:1100px;margin:0 auto;border-bottom:1px solid #F0EAF6}
  .logo-container .logo-link{display:flex;align-items:center;gap:8px;font-weight:700;
    font-size:18px;color:var(--text);text-decoration:none}
  .logo-img{width:30px;height:30px;border-radius:8px}
  main{max-width:440px;margin:28px auto;padding:0 16px 30px}
  .nueva-contrasena-card{background:#fff;border:1px solid #EDE8F0;border-radius:16px;
    box-shadow:0 4px 20px rgba(0,0,0,.06);padding:22px 20px}
  .nueva-contrasena-card h1{font-size:22px;font-weight:700;text-align:center}
  .nueva-contrasena-subtitulo{font-size:12px;color:var(--muted);text-align:center;margin-top:4px}
  .alerta-error{display:none;background:#FFF1F3;border:1px solid #FFE0E6;color:var(--error);
    padding:8px 10px;border-radius:10px;font-size:12px;text-align:center;margin-top:10px}
  .alerta-error.show{display:block}
  .alerta-exito{display:none;background:#E8FFF1;border:1px solid #C6F5D9;color:#0E8F4B;
    padding:8px 10px;border-radius:10px;font-size:12px;text-align:center;margin-top:10px}
  .alerta-exito.show{display:block}
  .form-group{display:flex;flex-direction:column;gap:5px;margin-top:12px}
  .form-group label{font-size:11px;font-weight:600;color:#5A5D72}
  .input-password-wrapper{position:relative}
  .input-password-wrapper input{width:100%;height:40px;padding:0 40px 0 12px;border:1px solid #DFDAEE;
    border-radius:10px;font-size:13px;outline:none}
  .input-password-wrapper input:focus{border-color:var(--cyan)}
  .input-password-wrapper input.campo-error{border-color:var(--error);background:#FFF6F7}
  .btn-toggle-password{position:absolute;right:6px;top:50%;transform:translateY(-50%);
    width:30px;height:30px;border:none;background:none;cursor:pointer;color:var(--muted)}
  .btn-toggle-password svg{width:18px;height:18px}
  .error-mensaje{display:none;font-size:11px;color:var(--error);margin-top:4px}
  .error-mensaje.show{display:block}
  .btn-nueva-contrasena{width:100%;height:42px;border-radius:20px;border:none;background:var(--cyan);
    color:#fff;font-weight:700;font-size:13px;cursor:pointer;margin-top:14px}
  .btn-nueva-contrasena:hover{background:var(--cyan-hover)}
  .nueva-contrasena-enlaces{text-align:center;margin-top:12px}
  .link-cancelar{font-size:11px;font-weight:600;color:var(--muted);text-decoration:underline}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;
    align-items:center;justify-content:center;padding:16px;z-index:50}
  .modal-overlay.open{display:flex}
  .modal-contenido{width:min(420px,100%);background:#fff;border-radius:14px;padding:20px;text-align:center}
  .modal-badge-exito{width:40px;height:40px;border-radius:10px;background:#E8FFF1;display:grid;
    place-items:center;margin:0 auto 12px;color:#1BBF6B;font-weight:700}
  .modal-contenido h2{font-size:15px;font-weight:700}
  .modal-contenido p{font-size:12px;color:var(--muted);margin-top:6px}
  .btn-modal-continuar{display:inline-block;margin-top:14px;height:38px;line-height:38px;padding:0 24px;
    border-radius:20px;background:var(--cyan);color:#fff;font-weight:700;font-size:13px;text-decoration:none}
  @media(max-width:640px){.header-nav{padding:0 14px}}
</style>
</head>
<body>

<header class="header-nav">
  <div class="logo-container">
    <a href="#" class="logo-link">
      <img src="../Logo1.png" alt="Logo Mindzyxs" class="logo-img">
      Mindzyxs
    </a>
  </div>
</header>

<main>
  <section class="nueva-contrasena-card">
    <h1>Nueva contraseña</h1>
    <p class="nueva-contrasena-subtitulo">Establece tu nueva contraseña</p>

    <div id="banner-error" class="alerta-error"></div>
    <div id="banner-exito" class="alerta-exito"></div>

    <form class="form-nueva-contrasena" id="form-nueva-contrasena" novalidate action="#">
      <div class="form-group">
        <label for="contrasena">Nueva contraseña</label>
        <div class="input-password-wrapper">
          <input type="password" id="contrasena" name="contrasena" placeholder="Mín. 6 caracteres" minlength="6" required>
          <button type="button" class="btn-toggle-password" data-target="contrasena" aria-label="Mostrar/ocultar contraseña">
            <svg class="icono-toggle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
        <span id="error-contrasena" class="error-mensaje"></span>
      </div>

      <div class="form-group">
        <label for="confirmar-contrasena">Confirmar contraseña</label>
        <div class="input-password-wrapper">
          <input type="password" id="confirmar-contrasena" name="confirmar_contrasena" placeholder="Repite tu contraseña" minlength="6" required>
          <button type="button" class="btn-toggle-password" data-target="confirmar-contrasena" aria-label="Mostrar/ocultar contraseña">
            <svg class="icono-toggle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
        <span id="error-confirmar" class="error-mensaje"></span>
      </div>

      <button type="submit" id="btn-guardar" class="btn-nueva-contrasena">Guardar contraseña</button>

      <div class="nueva-contrasena-enlaces">
        <a href="../PB-02/mockup-HU1-PB2.html" id="link-cancelar" class="link-cancelar">Cancelar / Volver</a>
      </div>
    </form>
  </section>
</main>

<div id="modal-exito" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-exito-titulo">
  <div class="modal-contenido">
    <div class="modal-badge-exito"><span>&check;</span></div>
    <h2 id="modal-exito-titulo">Contraseña actualizada</h2>
    <p>Tu contraseña ha sido restablecida correctamente. Ya puedes iniciar sesión.</p>
    <a href="../PB-02/mockup-HU1-PB2.html" class="btn-modal-continuar">Iniciar sesión</a>
  </div>
</div>

<script>
  var formNueva = document.getElementById('form-nueva-contrasena');
  var inputContrasena = document.getElementById('contrasena');
  var inputConfirmar = document.getElementById('confirmar-contrasena');
  var errorContrasena = document.getElementById('error-contrasena');
  var errorConfirmar = document.getElementById('error-confirmar');
  var bannerError = document.getElementById('banner-error');
  var bannerExito = document.getElementById('banner-exito');
  var modalExito = document.getElementById('modal-exito');
  var btnGuardar = document.getElementById('btn-guardar');

  document.querySelectorAll('.btn-toggle-password').forEach(function (btn) {
    btn.addEventListener('click', function (e) {
      e.preventDefault();
      var campo = document.getElementById(btn.getAttribute('data-target'));
      if (!campo) return;
      if (campo.type === 'password') {
        campo.type = 'text';
        btn.classList.add('visible');
      } else {
        campo.type = 'password';
        btn.classList.remove('visible');
      }
    });
  });

  function marcarError(input, span, msg) {
    input.classList.add('campo-error');
    span.textContent = msg;
    span.classList.add('show');
  }
  function limpiarError(input, span) {
    input.classList.remove('campo-error');
    span.classList.remove('show');
    span.textContent = '';
  }
  function mostrarBanner(msg) { bannerError.textContent = msg; bannerError.classList.add('show'); }
  function ocultarBanners() {
    bannerError.classList.remove('show');
    bannerExito.classList.remove('show');
  }

  inputContrasena.addEventListener('input', function () {
    limpiarError(inputContrasena, errorContrasena);
    ocultarBanners();
  });
  inputConfirmar.addEventListener('input', function () {
    limpiarError(inputConfirmar, errorConfirmar);
    ocultarBanners();
  });
  inputConfirmar.addEventListener('blur', function () {
    if (inputContrasena.value && inputConfirmar.value && inputContrasena.value !== inputConfirmar.value) {
      marcarError(inputConfirmar, errorConfirmar, 'Las contraseñas no coinciden');
    }
  });

  // Demostración de interfaz: con datos válidos se muestra el modal de éxito.
  // El sistema real guarda la contraseña en el servidor.
  formNueva.addEventListener('submit', function (e) {
    e.preventDefault();
    ocultarBanners();

    var contrasena = inputContrasena.value;
    var confirmar = inputConfirmar.value;

    if (!contrasena || contrasena.trim() === '') {
      marcarError(inputContrasena, errorContrasena, 'La contraseña es obligatoria');
      return;
    }
    if (contrasena.length < 6) {
      marcarError(inputContrasena, errorContrasena, 'La contraseña debe tener mínimo 6 caracteres');
      return;
    }
    limpiarError(inputContrasena, errorContrasena);

    if (!confirmar || confirmar.trim() === '') {
      marcarError(inputConfirmar, errorConfirmar, 'Debes confirmar tu contraseña');
      return;
    }
    if (contrasena !== confirmar) {
      marcarError(inputConfirmar, errorConfirmar, 'Las contraseñas no coinciden');
      return;
    }
    limpiarError(inputConfirmar, errorConfirmar);

    btnGuardar.disabled = true;
    btnGuardar.textContent = 'Guardando...';
    setTimeout(function () {
      btnGuardar.disabled = false;
      btnGuardar.textContent = 'Guardar contraseña';
      formNueva.reset();
      modalExito.classList.add('open');
    }, 600);
  });

  modalExito.addEventListener('click', function (e) {
    if (e.target === modalExito) modalExito.classList.remove('open');
  });
</script>
</body>
</html>
